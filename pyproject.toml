[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-llm-router"
version = "0.1.0"
description = "Zero-dependency model router for Python AI agents — role-based, cost-capped, latency-aware, with circuit-breakers."
authors = [{name = "Hussain Al-Saibai", email = "hussain.alsaibai@gmail.com"}]
license = {text = "MIT"}
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["llm", "router", "agents", "model-routing", "circuit-breaker", "ai", "gpt", "claude", "gemini"]

[project.urls]
Homepage = "https://github.com/hussain-alsaibai/tiny-llm-router"
Issues = "https://github.com/hussain-alsaibai/tiny-llm-router/issues"

[tool.setuptools]
py-modules = ["tiny_llm_router"]
